name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [blog-updated]   # sent by the blog repo after it deploys, so the homepage, search and sitemap pick up new posts

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BLOG_URL: ${{ vars.BLOG_URL }}   # optional repository variable; empty means the default in site.config.mjs

      - name: SEO audit
        run: node scripts/audit.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BLOG_URL: ${{ vars.BLOG_URL }}   # optional repository variable; empty means the default in site.config.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Optional: rebuild the blog so it picks up header, footer or stylesheet changes.
      # Needs repository variable BLOG_REPO (LJ-Web-Management/blog.careereducationinstitute.org) and secret
      # SITE_DISPATCH_TOKEN (a fine-grained token with Contents: read and write on that repo).
      - name: Tell the blog to rebuild
        if: ${{ vars.BLOG_REPO != '' && github.event_name != 'repository_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api "repos/${{ vars.BLOG_REPO }}/dispatches" -f event_type=site-shell-updated
